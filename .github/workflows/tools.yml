name: Tools

# Helpers that would otherwise need a terminal. Start them from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "check-rls = Sicherheit prüfen, igdb-check = IGDB-Verbindung prüfen"
        type: choice
        options: [check-rls, igdb-check]
        default: check-rls

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run task
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ALLOWED_EMAIL: ${{ secrets.ALLOWED_EMAIL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          TASK: ${{ inputs.task }}
        run: |
          case "$TASK" in
            check-rls) npm run check:rls ;;
            igdb-check) npm run igdb:check ;;
            *) echo "Unknown task"; exit 1 ;;
          esac
