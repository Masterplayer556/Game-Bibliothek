name: Sync

# Runs every 6 hours, can be started by hand from the Actions tab, and is started by the
# app's buttons through the Edge Function «trigger-sync».
# GitHub switches off schedules in public repositories after 60 days without repository
# activity. The job «keep-alive» re-enables this workflow through the API once a week, which
# resets that clock; the app also warns when no sync succeeded for 24 hours.
on:
  schedule:
    - cron: "17 */6 * * *"
    # Mondays: keep-alive only (the same expression is used in both jobs' `if`)
    - cron: "43 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "sync = Daten holen, test = nur Verbindung testen"
        type: choice
        options: [sync, test]
        default: sync
      adapter:
        description: "Nur diesen Adapter (leer = alle), z. B. steam"
        type: string
        default: ""
      run_id:
        description: "Intern: ID aus sync_runs (wird von der App gesetzt)"
        type: string
        default: ""

# The sync itself can only read the repository. Only the keep-alive job, which runs none
# of the project's code, may change workflows.
permissions:
  contents: read

jobs:
  sync:
    if: github.event.schedule != '43 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The script logs counts and states only: logs of a public repository are public.
      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          ALLOWED_EMAIL: ${{ secrets.ALLOWED_EMAIL }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          # optional overrides, set as repository variables if Nintendo changes something
          NINTENDO_APP_VERSION: ${{ vars.NINTENDO_APP_VERSION }}
          NINTENDO_APP_BUILD: ${{ vars.NINTENDO_APP_BUILD }}
          NINTENDO_PLAYTIME_UNIT: ${{ vars.NINTENDO_PLAYTIME_UNIT }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_ADAPTER: ${{ inputs.adapter }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        run: |
          npm run sync -- --mode="${INPUT_MODE:-sync}" --adapter="$INPUT_ADAPTER" --run-id="$INPUT_RUN_ID" --trigger="$TRIGGER"

  keep-alive:
    if: github.event.schedule == '43 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X PUT "repos/$REPO/actions/workflows/sync.yml/enable" && echo "schedule refreshed"
