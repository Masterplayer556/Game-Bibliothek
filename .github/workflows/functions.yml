name: Edge Functions deployen

# Uploads the Supabase Edge Functions and their secrets. Start it from the Actions tab
# after a function has changed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Find the project
        run: |
          ref=$(grep '^NEXT_PUBLIC_SUPABASE_URL=' .env.production | sed -E 's#.*https://([a-z0-9]+)\.supabase\.co.*#\1#')
          if [ -z "$ref" ]; then echo "Project not found in .env.production"; exit 1; fi
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "The secret SUPABASE_ACCESS_TOKEN is missing"; exit 1; fi

      # The functions share their logic with the app: copy it next to them (single source).
      - name: Copy shared code
        run: |
          mkdir -p supabase/functions/_shared
          cp src/core/crypto.ts supabase/functions/_shared/crypto.ts
          cp src/core/nintendo/auth.ts supabase/functions/_shared/nintendo-auth.ts
          cp src/core/nintendo/api.ts supabase/functions/_shared/nintendo-api.ts
          cp src/core/igdb/client.ts supabase/functions/_shared/igdb-client.ts

      # The functions check the login token and the allowed e-mail themselves.
      - name: Deploy functions
        run: |
          for fn in nintendo-login save-credential igdb-search trigger-sync; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          done

      - name: Set function secrets
        env:
          KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          IGDB_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$KEY" ]; then echo "The secret CREDENTIALS_ENCRYPTION_KEY is missing"; exit 1; fi
          umask 077
          printf 'GB_CREDENTIALS_ENCRYPTION_KEY=%s\n' "$KEY" > "$RUNNER_TEMP/functions.env"
          # IGDB is optional: only passed on when both secrets exist
          # «Jetzt synchronisieren» in the app: optional as well
          if [ -n "$DISPATCH_TOKEN" ]; then
            printf 'GB_GITHUB_DISPATCH_TOKEN=%s\nGB_GITHUB_REPO=%s\n' "$DISPATCH_TOKEN" "$REPO" >> "$RUNNER_TEMP/functions.env"
          fi
          if [ -n "$IGDB_ID" ] && [ -n "$IGDB_SECRET" ]; then
            printf 'GB_IGDB_CLIENT_ID=%s\nGB_IGDB_CLIENT_SECRET=%s\n' "$IGDB_ID" "$IGDB_SECRET" >> "$RUNNER_TEMP/functions.env"
          fi
          supabase secrets set --env-file "$RUNNER_TEMP/functions.env" --project-ref "$PROJECT_REF" --yes
          rm -f "$RUNNER_TEMP/functions.env"
