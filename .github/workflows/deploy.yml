name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job gets only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Public values only. Repository variables win over the committed .env.production.
      - name: Public build settings
        env:
          BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          REPO_NAME: ${{ github.event.repository.name }}
          SB_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SB_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          echo "NEXT_PUBLIC_BASE_PATH=${BASE_PATH:-/$REPO_NAME}" >> "$GITHUB_ENV"
          if [ -n "$SB_URL" ]; then echo "NEXT_PUBLIC_SUPABASE_URL=$SB_URL" >> "$GITHUB_ENV"; fi
          if [ -n "$SB_KEY" ]; then echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SB_KEY" >> "$GITHUB_ENV"; fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
